[project]
name = "video-quality-harness"
version = "0.1.0"
description = "Automatizovani regresioni testovi kvaliteta video enkodiranja (FFmpeg + VMAF)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-html>=4.1"]

[project.scripts]
vqh-encode = "vqh.encode:main"
vqh-quality = "vqh.quality:main"
vqh-report = "vqh.report:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
